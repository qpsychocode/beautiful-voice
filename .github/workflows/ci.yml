name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/beautiful_voice.spec --noconfirm
      - run: Compress-Archive -Path dist/BeautifulVoice -DestinationPath BeautifulVoice-${{ github.ref_name }}-windows.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: BeautifulVoice-${{ github.ref_name }}-windows.zip
