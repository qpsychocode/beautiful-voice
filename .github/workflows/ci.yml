name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  # Tags like v0.2.0 build the apps and attach them to a GitHub release. Asset
  # names stay fixed so the website's download buttons always get the latest.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Stamp the version from the tag
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          (Get-Content beautiful_voice/paths.py) -replace '^APP_VERSION = .*', "APP_VERSION = `"$v`"" | Set-Content beautiful_voice/paths.py
      - run: pyinstaller packaging/beautiful_voice.spec --noconfirm
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$('${{ github.ref_name }}'.TrimStart('v'))" packaging/installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: Compress-Archive -Path dist/BeautifulVoice -DestinationPath BeautifulVoice-windows.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BeautifulVoice-Setup.exe
            BeautifulVoice-windows.zip

  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release  # after Windows, so the two jobs don't both create the release
    runs-on: macos-14  # Apple Silicon
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Stamp the version from the tag
        run: sed -i '' "s/^APP_VERSION = .*/APP_VERSION = \"${GITHUB_REF_NAME#v}\"/" beautiful_voice/paths.py
      - run: python tools/make_icon.py
      - run: pyinstaller packaging/beautiful_voice.spec --noconfirm
      - name: Build the disk image
        run: |
          mkdir dmg
          cp -R "dist/Beautiful Voice.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Beautiful Voice" -srcfolder dmg -ov -format UDZO BeautifulVoice-macOS.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: BeautifulVoice-macOS.dmg
